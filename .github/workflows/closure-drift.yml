# Garante que cada versão publicada (tag v*) nomeie um único código.
#
# Falha se uma tag nova declarar, no package.json, uma versão que outra tag já
# usa com código diferente — o "esqueci de subir a versão". Configuração em
# .closure-drift.json. Ferramenta: luizfnsilva/closure_drift, fixada pelo
# commit da v1.1.3 para que o código executado não mude sozinho.
name: closure_drift

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # would-tag: "esta tag reaproveita uma versão que outra tag usa com código
      # diferente?". O modo measure daria "inconclusivo" (falha) enquanto só
      # existir uma tag, sem haver erro nenhum.
      - uses: luizfnsilva/closure_drift@f402fa7c2d0b8c3e50a99685e21620b47ab2ffcf # v1.1.3
        with:
          mode: would-tag
